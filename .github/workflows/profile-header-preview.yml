name: Preview standalone constellation section headers

on:
  push:
    branches:
      - feat/profile-separated-headers-20261028
    paths:
      - "README.md"
      - "scripts/split_constellation_headers.py"
      - ".github/workflows/profile-header-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: header-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Pillow and GIF crop utility
        run: |
          python -m pip install -r scripts/requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y gifsicle
      - name: Ensure original constellation artwork is unchanged
        run: |
          git diff --exit-code origin/main -- \
            assets/constellation-languages.png assets/constellation-languages.gif \
            assets/constellation-frameworks.png assets/constellation-frameworks.gif \
            assets/constellation-tools.png assets/constellation-tools.gif
      - name: Generate and verify six crop assets
        run: |
          python scripts/split_constellation_headers.py
          python scripts/split_constellation_headers.py --verify-only
          git diff --check
      - name: Commit derived preview images (never originals)
        run: |
          git add \
            assets/constellation-languages-header.png assets/constellation-languages-body.gif \
            assets/constellation-frameworks-header.png assets/constellation-frameworks-body.gif \
            assets/constellation-tools-header.png assets/constellation-tools-body.gif
          if ! git diff --cached --quiet; then
            remote_head=$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)
            test "$remote_head" = "$GITHUB_SHA"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(profile): generate separated heading preview assets"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
