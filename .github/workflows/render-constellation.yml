name: Render profile constellation

on:
  push:
    branches:
      - main
      - feat/profile-particle-constellation-20261025
    paths:
      - "scripts/render_constellation.py"
      - "scripts/render_sections.py"
      - "assets/moonbit-official.png"
      - "data/icon-paths.json"
      - "data/supplemental-icons.json"
      - ".github/workflows/render-constellation.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install renderer dependencies
        run: python -m pip install -r scripts/requirements.txt
      - name: Render Languages and Markup only
        run: python scripts/render_sections.py --only languages
      - name: Verify Languages render only
        run: |
          python - <<'PY'
          from PIL import Image
          with Image.open("assets/constellation-languages.png") as p, \
               Image.open("assets/constellation-languages.gif") as g:
              assert p.size == g.size == (1600, 780)
              assert g.n_frames == 18
              assert g.info.get("loop") == 0
          print("Languages-only visual asset checks passed")
          PY
      - name: Commit generated image assets
        run: |
          git rm -f --ignore-unmatch assets/constellation.gif assets/constellation.png
          git add -A assets
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(profile): render sectioned skill constellations"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
