name: Render profile constellation

on:
  push:
    branches:
      - main
      - feat/profile-particle-constellation-20261025
    paths:
      - "scripts/render_constellation.py"
      - "scripts/render_sections.py"
      - "scripts/verify_languages.py"
      - "scripts/framework_orbits.py"
      - "scripts/framework_contours.json"
      - "scripts/verify_frameworks.py"
      - "scripts/requirements.txt"
      - "assets/constellation-*.gif"
      - "assets/constellation-*.png"
      - "assets/moonbit-official.png"
      - "data/icon-paths.json"
      - "data/supplemental-icons.json"
      - ".github/workflows/render-constellation.yml"
  workflow_dispatch:
    inputs:
      section:
        description: "Authorized section to regenerate (the other artwork is frozen)"
        type: choice
        default: frameworks
        options: [frameworks, languages, both]

permissions:
  contents: read

concurrency:
  group: constellation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPYCACHEPREFIX: ${{ runner.temp }}/constellation-pycache
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install renderer dependencies
        run: python -m pip install -r scripts/requirements.txt
      - name: Select isolated section generation
        id: selection
        env:
          REQUESTED: ${{ inputs.section }}
          BEFORE: ${{ github.event.before }}
        run: |
          python - <<'PY'
          import os, subprocess
          requested = os.environ.get('REQUESTED')
          if requested:
              assert requested in ('languages', 'frameworks', 'both')
              selected = requested
          else:
              before = os.environ.get('BEFORE', '')
              if not before or set(before) == {'0'}:
                  before = 'HEAD^'
              changed = set(subprocess.check_output(['git','diff','--name-only',before,'HEAD'],text=True).splitlines())
              frameworks = bool(changed & {'scripts/framework_orbits.py','scripts/framework_contours.json','scripts/verify_frameworks.py'})
              frameworks |= any(p.startswith('assets/constellation-frameworks.') for p in changed)
              languages = bool(changed & {'scripts/verify_languages.py','assets/moonbit-official.png'})
              languages |= any(p.startswith('assets/constellation-languages.') for p in changed)
              # A generic renderer-only push retains the existing Languages path.
              # Mixed shared changes still have to pass BOTH content verifiers;
              # an ambiguous change fails closed until an explicit dispatch.
              shared = bool(changed & {'scripts/render_sections.py','scripts/render_constellation.py','data/icon-paths.json','data/supplemental-icons.json'})
              selected = 'both' if languages and frameworks else ('frameworks' if frameworks else ('languages' if languages or shared else 'frameworks'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write(f'section={selected}\n')
          print('Regenerating:', selected)
          PY
      - name: Record complete protected file guard
        env:
          SECTION: ${{ steps.selection.outputs.section }}
        run: |
          python - <<'PY'
          import hashlib, json, os, subprocess
          selected = ('languages','frameworks') if os.environ['SECTION']=='both' else (os.environ['SECTION'],)
          allowed = {f'assets/constellation-{s}.{ext}' for s in selected for ext in ('gif','png')}
          paths = subprocess.check_output(['git','ls-files'],text=True).splitlines()
          guard = {p:hashlib.sha256(open(p,'rb').read()).hexdigest() for p in paths if p not in allowed}
          with open(os.environ['RUNNER_TEMP']+'/constellation-guard.json','w') as output:
              json.dump({'allowed':sorted(allowed),'sha256':guard},output)
          PY
      - name: Record preserved artwork checksums for Languages
        if: steps.selection.outputs.section != 'frameworks'
        run: sha256sum assets/constellation-{frameworks,tools}.{gif,png} assets/moonbit-official.png > "$RUNNER_TEMP/constellation-preserved.sha256"
      - name: Render Languages and Markup only
        if: steps.selection.outputs.section != 'frameworks'
        run: python scripts/render_sections.py --only languages
      - name: Verify Languages and preserved artwork
        run: |
          python -m py_compile scripts/render_constellation.py scripts/render_sections.py scripts/verify_languages.py scripts/framework_orbits.py scripts/verify_frameworks.py
          python scripts/verify_languages.py
          if [ -f "$RUNNER_TEMP/constellation-preserved.sha256" ]; then
            sha256sum --check "$RUNNER_TEMP/constellation-preserved.sha256"
          fi
      - name: Render Frameworks only
        if: steps.selection.outputs.section != 'languages'
        run: python scripts/render_sections.py --only frameworks
      - name: Verify Frameworks content and canonical determinism
        env:
          SECTION: ${{ steps.selection.outputs.section }}
        run: |
          extra=()
          if [ "$SECTION" = frameworks ]; then extra+=(--protected); fi
          python scripts/verify_frameworks.py --determinism "${extra[@]}" --report "$RUNNER_TEMP/frameworks-verification.json"
      - name: Verify all unselected tracked files and changed-file scope
        run: |
          python - <<'PY'
          import hashlib, json, os, subprocess
          guard = json.load(open(os.environ['RUNNER_TEMP']+'/constellation-guard.json'))
          for path, expected in guard['sha256'].items():
              assert hashlib.sha256(open(path,'rb').read()).hexdigest()==expected, path
          changed = set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changed <= set(guard['allowed']), changed
          assert not subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).strip(), 'Unexpected new files'
          print('All unselected files unchanged; only selected image pairs may be staged.')
          PY
          git diff --check
      - name: Record rendering environment
        run: |
          python - <<'PY'
          import ctypes, hashlib, importlib.metadata, json, os, platform, sys
          from pathlib import Path
          import cairocffi
          from PIL import features
          ft = ctypes.CDLL('libfreetype.so.6')
          handle = ctypes.c_void_p()
          ft.FT_Init_FreeType(ctypes.byref(handle))
          a,b,c = ctypes.c_int(),ctypes.c_int(),ctypes.c_int()
          ft.FT_Library_Version(handle,ctypes.byref(a),ctypes.byref(b),ctypes.byref(c))
          fonts = {str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in Path('/usr/share/fonts/truetype/dejavu').glob('DejaVuSans*.ttf')}
          report = {'python':sys.version,'platform':platform.platform(),'cairo':cairocffi.cairo_version_string(),
                    'system_freetype':[a.value,b.value,c.value],'pillow_freetype':features.version_module('freetype2'),
                    'packages':{d.metadata['Name']:d.version for d in importlib.metadata.distributions()},'font_sha256':fonts}
          Path(os.environ['RUNNER_TEMP']+'/render-environment.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: constellation-verification-${{ github.sha }}
          path: |
            ${{ runner.temp }}/frameworks-verification.json
            ${{ runner.temp }}/render-environment.json
          if-no-files-found: error
      - name: Commit generated image assets
        if: github.ref == 'refs/heads/feat/profile-particle-constellation-20261025'
        env:
          SECTION: ${{ steps.selection.outputs.section }}
        run: |
          sections=("$SECTION")
          if [ "$SECTION" = both ]; then sections=(languages frameworks); fi
          for section in "${sections[@]}"; do
            git add "assets/constellation-${section}.gif" "assets/constellation-${section}.png"
          done
          if ! git diff --cached --quiet; then
            remote_head=$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)
            test "$remote_head" = "$GITHUB_SHA"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(profile): render validated ${SECTION} constellations"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "Validated assets already match the committed files."
          fi
