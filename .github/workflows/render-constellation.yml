name: Render profile constellation

on:
  push:
    branches:
      - main
      - feat/profile-particle-constellation-20261025
    paths:
      - "scripts/render_constellation.py"
      - "scripts/render_sections.py"
      - "scripts/verify_languages.py"
      - "assets/moonbit-official.png"
      - "data/icon-paths.json"
      - "data/supplemental-icons.json"
      - ".github/workflows/render-constellation.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install renderer dependencies
        run: python -m pip install -r scripts/requirements.txt
      - name: Record preserved artwork checksums
        run: sha256sum assets/constellation-{frameworks,tools}.{gif,png} assets/moonbit-official.png > "$RUNNER_TEMP/constellation-preserved.sha256"
      - name: Render Languages and Markup only
        run: python scripts/render_sections.py --only languages
      - name: Verify Languages render only
        run: |
          python -m py_compile scripts/render_constellation.py scripts/render_sections.py scripts/verify_languages.py
          python scripts/verify_languages.py
          sha256sum --check "$RUNNER_TEMP/constellation-preserved.sha256"
      - name: Commit generated image assets
        run: |
          git add assets/constellation-languages.gif assets/constellation-languages.png
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(profile): render sectioned skill constellations"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "Generated Languages assets already match the committed files."
          fi
