name: Preview center-aligned full-width constellation sections
on:
  push:
    branches: [feat/profile-separated-headers-20261028]
    paths:
      - "README.md"
      - "scripts/render_centered_constellation.py"
      - ".github/workflows/profile-centered-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: centered-constellation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned requirements
        run: python -m pip install -r scripts/requirements.txt
      - name: Verify frozen originals before rendering
        run: |
          git diff --exit-code origin/main -- assets/constellation-languages.gif assets/constellation-languages.png \
            assets/constellation-frameworks.gif assets/constellation-frameworks.png \
            assets/constellation-tools.gif assets/constellation-tools.png
      - name: Generate centered headings and verify decoded image pixels
        run: |
          python scripts/render_centered_constellation.py
          python scripts/render_centered_constellation.py --verify-only
          git diff --check
      - name: Commit new preview GIFs only
        run: |
          git add assets/constellation-languages-centered.gif \
            assets/constellation-frameworks-centered.gif \
            assets/constellation-tools-centered.gif
          if ! git diff --cached --quiet; then
            remote_head=$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)
            test "$remote_head" = "$GITHUB_SHA"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(profile): generate centered section preview GIFs"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
